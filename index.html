<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROADBOOK | La route autrement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: { DEFAULT: '#8B1E24', hover: '#70161B', soft: 'rgba(139, 30, 36, 0.08)' },
                        asphalt: { DEFAULT: '#18181B', soft: '#27272A' },
                        cream: { DEFAULT: '#F7F5F2', dark: '#EAE6DF' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        #leaflet-map {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 4rem);
            z-index: 10;
        }
        .strava-mini-map {
            height: 180px;
            width: 100%;
            z-index: 1;
        }
        /* Style Waze Navigation Glowing Route */
        .waze-route-glow {
            stroke: #3B82F6;
            stroke-opacity: 0.6;
            stroke-width: 10px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .waze-route-main {
            stroke: #2563EB;
            stroke-opacity: 1;
            stroke-width: 5px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body class="bg-cream text-asphalt font-sans min-h-screen flex flex-col selection:bg-crimson selection:text-white">

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- HEADER SUPÉRIEUR -->
    <header class="bg-asphalt text-white border-b border-zinc-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2 sm:gap-4">
            
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-10 h-10 rounded-xl bg-crimson flex items-center justify-center text-white shadow-lg shadow-crimson/30 overflow-hidden relative">
                    <svg viewBox="0 0 48 48" class="w-12 h-12 translate-x-2.5 translate-y-0.5 shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="24" cy="24" r="19" stroke-width="4" />
                        <circle cx="24" cy="24" r="5" stroke-width="2.5" fill="#18181B" />
                        <circle cx="24" cy="24" r="2" fill="currentColor" stroke="none" />
                        <line x1="6" y1="22.5" x2="18.5" y2="22.5" stroke-width="2.2" />
                        <line x1="6" y1="25.5" x2="18.5" y2="25.5" stroke-width="2.2" />
                        <circle cx="11" cy="24" r="0.8" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="24" r="0.8" fill="currentColor" stroke="none" />
                        <line x1="29.5" y1="22.5" x2="42" y2="22.5" stroke-width="2.2" />
                        <line x1="29.5" y1="25.5" x2="42" y2="25.5" stroke-width="2.2" />
                        <circle cx="33" cy="24" r="0.8" fill="currentColor" stroke="none" />
                        <line x1="22.5" y1="29.5" x2="22.5" y2="42" stroke-width="2.2" />
                        <line x1="25.5" y1="29.5" x2="25.5" y2="42" stroke-width="2.2" />
                        <circle cx="24" cy="33.5" r="0.8" fill="currentColor" stroke="none" />
                        <circle cx="24" cy="37.5" r="0.8" fill="currentColor" stroke="none" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-serif text-lg font-bold tracking-wider text-white">ROADBOOK</h1>
                    <span class="text-[10px] font-mono text-zinc-400 block -mt-1 uppercase tracking-widest">La route autrement</span>
                </div>
            </div>

            <!-- Onglets -->
            <nav class="flex items-center gap-1 bg-zinc-900/90 p-1 rounded-2xl border border-zinc-800 overflow-x-auto">
                <button onclick="switchTab('feed')" id="nav-feed" class="px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 bg-crimson text-white">
                    <i class="fa-solid fa-rss"></i>
                    <span class="hidden sm:inline">Actualité</span>
                </button>
                <button onclick="switchTab('explorer')" id="nav-explorer" class="px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 text-zinc-400">
                    <i class="fa-solid fa-compass"></i>
                    <span class="hidden sm:inline">Explorer</span>
                </button>
                <button onclick="switchTab('map')" id="nav-map" class="px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 text-zinc-400">
                    <i class="fa-solid fa-location-arrow"></i>
                    <span class="hidden sm:inline">Prendre la route</span>
                </button>
                <button onclick="switchTab('garage')" id="nav-garage" class="px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 text-zinc-400">
                    <i class="fa-solid fa-car"></i>
                    <span class="hidden sm:inline">Mon Garage</span>
                </button>
            </nav>

            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <div class="relative hidden sm:block">
                    <select id="header-vehicle-select" onchange="switchActiveVehicle(this.value)" class="bg-zinc-900 border border-zinc-700 text-white text-xs font-bold rounded-xl px-3 py-2 pr-8 appearance-none cursor-pointer focus:outline-none focus:border-crimson">
                    </select>
                    <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
                <button onclick="switchTab('garage')" class="flex items-center gap-2 pl-2 border-l border-zinc-800 group">
                    <img id="header-user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-xl object-cover border border-zinc-700 group-hover:border-crimson transition">
                </button>
            </div>
        </div>
    </header>

    <!-- VUE 1 : ACTUALITÉ -->
    <main id="view-feed" class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-6 pb-12 space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h2 class="font-serif text-xl font-bold text-asphalt">Actualité de la communauté</h2>
            <div class="flex items-center gap-3">
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="feed-member-search" oninput="filterFeedByMember(this.value)" placeholder="Trouvez des passionnés" class="w-full bg-white border border-zinc-200 rounded-xl pl-9 pr-4 py-1.5 text-xs font-semibold focus:outline-none focus:border-crimson shadow-sm">
                </div>
                <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-zinc-200 text-xs font-bold shadow-sm shrink-0">
                    <button onclick="setFeedFilter('following')" id="btn-feed-following" class="px-3 py-1 rounded-lg bg-crimson text-white transition">Abonnements</button>
                    <button onclick="setFeedFilter('all')" id="btn-feed-all" class="px-3 py-1 rounded-lg text-zinc-600 hover:text-asphalt transition">Tous</button>
                </div>
            </div>
        </div>
        <div id="feed-activities-container" class="space-y-5"></div>
    </main>

    <!-- VUE 2 : EXPLORER (Itinéraires) -->
    <main id="view-explorer" class="hidden flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 pb-12 space-y-6">
        <div class="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <h2 class="font-serif text-xl font-bold text-asphalt">Explorer les Itinéraires de France</h2>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 bg-cream px-3.5 py-2 rounded-xl border border-zinc-300 cursor-pointer text-xs font-bold text-asphalt hover:border-crimson transition">
                        <input type="checkbox" id="filter-loop-chk" onchange="filterRoutes()" class="accent-crimson">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-arrows-spin text-crimson"></i> Mode Boucle</span>
                    </label>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 pt-2 border-t border-zinc-100 text-xs">
                <div>
                    <label class="block font-bold text-zinc-500 uppercase mb-1">1. Proximité</label>
                    <select id="filter-prox" onchange="filterRoutes()" class="w-full rounded-xl bg-cream border border-zinc-300 px-3 py-2 font-semibold">
                        <option value="1000">Toute la France</option>
                        <option value="50">Moins de 50 km</option>
                        <option value="150">Moins de 150 km</option>
                        <option value="300">Moins de 300 km</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-zinc-500 uppercase mb-1">2. Durée / Distance</label>
                    <select id="filter-dur" onchange="filterRoutes()" class="w-full rounded-xl bg-cream border border-zinc-300 px-3 py-2 font-semibold">
                        <option value="all">Tous formats</option>
                        <option value="short">Courte (< 1h / < 60 km)</option>
                        <option value="medium">Moyenne (1h - 3h / 60-150 km)</option>
                        <option value="long">Journée (> 3h / > 150 km)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-zinc-500 uppercase mb-1">3. Tracé & Accès</label>
                    <select id="filter-winding" onchange="filterRoutes()" class="w-full rounded-xl bg-cream border border-zinc-300 px-3 py-2 font-semibold">
                        <option value="all">Tous profils</option>
                        <option value="LIAISON">Liaison rapide</option>
                        <option value="SINUEUX">Sinueux & Épingles</option>
                        <option value="MIXTE">Mixte & Fluide</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-zinc-500 uppercase mb-1">4. Dénivelé D+</label>
                    <select id="filter-elev" onchange="filterRoutes()" class="w-full rounded-xl bg-cream border border-zinc-300 px-3 py-2 font-semibold">
                        <option value="all">Tous dénivelés</option>
                        <option value="low">Plat / Doux (< 500m)</option>
                        <option value="mid">Modéré (500m - 1500m)</option>
                        <option value="high">Alpin / Fort (> 1500m)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-zinc-500 uppercase mb-1">5. Typologie route</label>
                    <select id="filter-type" onchange="filterRoutes()" class="w-full rounded-xl bg-cream border border-zinc-300 px-3 py-2 font-semibold">
                        <option value="all">Toutes typologies</option>
                        <option value="Col de montagne">Col de montagne</option>
                        <option value="Littoral">Littoral</option>
                        <option value="Rural">Rural</option>
                        <option value="Forêt">Forêt</option>
                        <option value="Vallée">Vallée</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="routes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- VUE 3 : CARTE GPS / NAVIGATION -->
    <main id="view-map" class="hidden flex-1 flex flex-col relative">
        <div class="absolute top-4 inset-x-4 z-30 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
            <div class="bg-asphalt/95 backdrop-blur-md text-white px-4 py-3 rounded-2xl shadow-xl border border-zinc-800 flex items-center gap-4 pointer-events-auto">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-crimson flex flex-col items-center justify-center font-mono font-extrabold shadow-inner">
                        <span id="speed-limit-sign" class="text-xs leading-none">80</span>
                        <span class="text-[9px] uppercase tracking-tighter text-white/80">km/h</span>
                    </div>
                    <div>
                        <span class="text-[10px] font-mono text-zinc-400 uppercase tracking-widest block">Vitesse réelle</span>
                        <div class="font-mono text-2xl font-extrabold flex items-baseline gap-1">
                            <span id="live-speed">76</span>
                            <span class="text-xs font-sans text-zinc-400">km/h</span>
                        </div>
                    </div>
                </div>
                <div class="hidden sm:flex items-center gap-2 pl-3 border-l border-zinc-800">
                    <button onclick="locateUserOnMap()" class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-crosshairs text-crimson"></i> Ma Position GPS
                    </button>
                    <button onclick="toggleAutoDrive()" id="btn-autodrive" class="px-3 py-1.5 rounded-xl bg-crimson hover:bg-crimson-hover text-white text-xs font-bold shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-play"></i> Rouler (Waze Mode)
                    </button>
                </div>
            </div>
        </div>

        <div id="leaflet-map" class="flex-1 w-full h-full"></div>

        <div class="absolute bottom-4 inset-x-4 z-30 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
            <div class="bg-asphalt/95 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl shadow-xl border border-zinc-800 flex flex-wrap items-center gap-3 pointer-events-auto text-xs font-bold">
                <span class="text-zinc-400 uppercase text-[10px]">Calques :</span>
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-crimson"><input type="checkbox" checked onchange="toggleMapLayer('stations', this.checked)" class="accent-crimson"> Carburants</label>
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-crimson"><input type="checkbox" checked onchange="toggleMapLayer('radars', this.checked)" class="accent-crimson"> Radars</label>
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-crimson"><input type="checkbox" checked onchange="toggleMapLayer('spots', this.checked)" class="accent-crimson"> Spots Photo</label>
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-crimson"><input type="checkbox" checked onchange="toggleMapLayer('parkings', this.checked)" class="accent-crimson"> Parkings</label>
            </div>
        </div>
    </main>

    <!-- VUE 4 : MON GARAGE -->
    <main id="view-garage" class="hidden flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 pb-12 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white rounded-2xl border border-zinc-200 p-6 shadow-sm space-y-5">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-4">
                            <img id="profile-avatar-display" src="" alt="Avatar" class="w-16 h-16 rounded-2xl object-cover border-2 border-crimson shadow">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 id="profile-pseudo-display" class="font-extrabold text-xl text-asphalt"></h2>
                                    <span id="profile-age-display" class="text-xs text-zinc-400 font-mono"></span>
                                </div>
                                <p id="profile-city-display" class="text-xs text-zinc-500"></p>
                                <div class="flex items-center gap-2 mt-1.5">
                                    <span id="profile-cat-display" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-crimson text-white"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p id="profile-bio-display" class="text-xs text-zinc-600 italic bg-cream p-3 rounded-xl border border-zinc-200/70"></p>
                    <div class="grid grid-cols-2 gap-3 pt-3 border-t border-zinc-100 font-mono text-center">
                        <div class="bg-cream p-3 rounded-xl border border-zinc-200">
                            <span class="text-[10px] text-zinc-400 uppercase block">Kilomètres parcourus</span>
                            <strong id="profile-total-km" class="text-asphalt text-lg">0 km</strong>
                        </div>
                        <div class="bg-cream p-3 rounded-xl border border-zinc-200">
                            <span class="text-[10px] text-zinc-400 uppercase block">Sorties validées</span>
                            <strong id="profile-total-trips" class="text-crimson text-lg">0</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Application Intégré -->
    <script>
        // Données d'exemple et intégration de l'itinéraire Nord Ardèche
        const ARDECHE_ROUTE_COORDS = [
            [45.31593, 4.81329], [45.31652, 4.81231], [45.31802, 4.80901], [45.29787, 4.82187],
            [45.24112, 4.79927], [45.1821, 4.7999], [45.14399, 4.8091], [45.09446, 4.83573],
            [45.04405, 4.82874], [44.94443, 4.85009], [44.98448, 4.57683], [45.1196, 4.53668],
            [45.16482, 4.67569], [45.18559, 4.73535], [45.27637, 4.8003], [45.31766, 4.76614], [45.31748, 4.80975]
        ];

        let routesData = [
            {
                id: 'ardeche-nord',
                title: 'Pour user le bord de vos pneus en nord Ardèche !!!!',
                type: 'Col de montagne',
                distance: 162.5,
                duration: '3h15',
                elevation: 2950,
                winding: 'SINUEUX',
                isLoop: true,
                coords: ARDECHE_ROUTE_COORDS,
                image: 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80'
            }
        ];

        let map, mainRouteLayer, mainRouteGlowLayer, userMarker;
        let isAutoDriving = false;
        let currentRouteIndex = 0;

        function initApp() {
            initMap();
            renderRoutesExplorer();
        }

        function initMap() {
            if (map) return;
            map = L.map('leaflet-map', { zoomControl: false }).setView([45.12, 4.75], 11);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            loadRouteOnMap(routesData[0]);
        }

        function loadRouteOnMap(route) {
            if (!map) return;
            if (mainRouteLayer) map.removeLayer(mainRouteLayer);
            if (mainRouteGlowLayer) map.removeLayer(mainRouteGlowLayer);

            // Style Waze Neon Glow
            mainRouteGlowLayer = L.polyline(route.coords, {
                color: '#3B82F6',
                weight: 10,
                opacity: 0.6,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            mainRouteLayer = L.polyline(route.coords, {
                color: '#2563EB',
                weight: 5,
                opacity: 1,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            map.fitBounds(mainRouteLayer.getBounds(), { padding: [50, 50] });
        }

        function renderRoutesExplorer() {
            const grid = document.getElementById('routes-grid');
            if (!grid) return;
            grid.innerHTML = routesData.map(route => `
                <div class="bg-white rounded-2xl border border-zinc-200 overflow-hidden shadow-sm flex flex-col hover:border-crimson transition">
                    <div class="relative h-40 bg-zinc-100 overflow-hidden">
                        <img src="${route.image}" alt="${route.title}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-asphalt/80 backdrop-blur-md text-white px-2.5 py-1 rounded-xl text-[10px] font-bold">
                            ${route.type}
                        </div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <h3 class="font-bold text-sm text-asphalt line-clamp-1">${route.title}</h3>
                            <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-zinc-100 font-mono text-center text-xs">
                                <div class="bg-cream p-2 rounded-xl">
                                    <span class="text-[9px] text-zinc-400 block uppercase">Dist.</span>
                                    <strong>${route.distance} km</strong>
                                </div>
                                <div class="bg-cream p-2 rounded-xl">
                                    <span class="text-[9px] text-zinc-400 block uppercase">D+</span>
                                    <strong>+${route.elevation}m</strong>
                                </div>
                                <div class="bg-cream p-2 rounded-xl">
                                    <span class="text-[9px] text-zinc-400 block uppercase">Temps</span>
                                    <strong>${route.duration}</strong>
                                </div>
                            </div>
                        </div>
                        <button onclick="startRouteNavigation('${route.id}')" class="w-full py-2.5 rounded-xl bg-crimson hover:bg-crimson-hover text-white text-xs font-bold transition flex items-center justify-center gap-2 shadow">
                            <i class="fa-solid fa-location-arrow"></i> Lancer l'itinéraire (Mode Waze)
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function startRouteNavigation(routeId) {
            const route = routesData.find(r => r.id === routeId);
            if (!route) return;
            switchTab('map');
            loadRouteOnMap(route);
            showToast(`Itinéraire chargé : ${route.title}`, 'success');
        }

        function switchTab(tabId) {
            ['feed', 'explorer', 'map', 'garage'].forEach(id => {
                const el = document.getElementById(`view-${id}`);
                const nav = document.getElementById(`nav-${id}`);
                if (el) el.classList.toggle('hidden', id !== tabId);
                if (nav) {
                    if (id === tabId) {
                        nav.className = "px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 bg-crimson text-white";
                    } else {
                        nav.className = "px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 text-zinc-400";
                    }
                }
            });
            if (tabId === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 200);
            }
        }

        function filterRoutes() {
            renderRoutesExplorer();
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `bg-asphalt text-white px-4 py-3 rounded-2xl shadow-2xl border border-zinc-800 text-xs font-bold flex items-center gap-3 transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-crimson"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleAutoDrive() {
            isAutoDriving = !isAutoDriving;
            const btn = document.getElementById('btn-autodrive');
            if (isAutoDriving) {
                btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pause`;
                showToast('Mode guidage Waze actif', 'success');
            } else {
                btn.innerHTML = `<i class="fa-solid fa-play"></i> Rouler`;
                showToast('Guidage en pause', 'info');
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
