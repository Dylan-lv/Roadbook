        function switchTab(tabId) {
            ['feed', 'explorer', 'map', 'garage'].forEach(id => {
                const el = document.getElementById(`view-${id}`);
                if (el) {
                    if (id === tabId) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });
            ['feed', 'explorer', 'map', 'garage'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                const bbtn = document.getElementById(`bnav-${id}`);
                if (btn) btn.className = id === tabId ? 'px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-crimson text-white shadow' : 'px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 text-zinc-300 hover:text-white hover:bg-zinc-800';

        function initLeafletMap() {
            const container = document.getElementById('leaflet-map');
            if (!container) return;

            if (!leafletMap) {
                // Initialisation de la carte Leaflet officielle
                leafletMap = L.map('leaflet-map', { zoomControl: false }).setView([45.7640, 4.8357], 11);
                L.control.zoom({ position: 'topright' }).addTo(leafletMap);

                // Calque de tuiles Carto / OpenStreetMap
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors & CARTO'
                }).addTo(leafletMap);

                poisLayersGroup = L.layerGroup().addTo(leafletMap);
                renderLeafletMapData();
                locateUserOnMap();
            } else {
                // Rafraîchissement obligatoire lors du passage d'un onglet masqué à visible
                leafletMap.invalidateSize();
            }
        }

        function locateUserOnMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (leafletMap) {
                        leafletMap.setView([lat, lng], 13);
                        if (userLocationMarker) leafletMap.removeLayer(userLocationMarker);
                        userLocationMarker = L.marker([lat, lng], {
                            icon: L.divIcon({ className: 'user-loc', html: `<div class="w-8 h-8 rounded-full bg-blue-600 border-2 border-white text-white flex items-center justify-center shadow-lg animate-pulse"><i class="fa-solid fa-location-crosshairs text-xs"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 16] })
                        }).addTo(leafletMap).bindPopup('<b>Vous êtes ici</b>').openPopup();
                    }
                });
            }
        }

        function renderLeafletMapData() {
            if (!leafletMap) return;
            poisLayersGroup.clearLayers();
            const activeVeh = appState.vehicles.find(v => v.id === appState.activeVehicleId) || appState.vehicles[0];
            const fuel = activeVeh ? activeVeh.fuel : 'SP98';

            if (mapLayersVisible.stations) {
                appState.mapPOIs.stations.forEach(st => {
                    const p = st.prices[fuel] || 'N/D';
                    const marker = L.marker([st.lat, st.lng], {
                        icon: L.divIcon({ className: 'poi', html: `<div class="w-8 h-8 rounded-full bg-asphalt border-2 border-crimson text-white flex items-center justify-center text-xs"><i class="fa-solid fa-gas-pump"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 16] })
                    }).bindPopup(`<div class="text-xs"><b>${st.name}</b><br>Tarif ${fuel}: ${p} €/L</div>`);
                    poisLayersGroup.addLayer(marker);
                });
            }

            const route = appState.routes.find(r => r.id === selectedRouteId);
            if (route && route.gpsCoords) {
                if (routePolylineLayer) leafletMap.removeLayer(routePolylineLayer);
                routePolylineLayer = L.polyline(route.gpsCoords, { color: '#8B1E24', weight: 5 }).addTo(leafletMap);
                leafletMap.fitBounds(routePolylineLayer.getBounds(), { padding: [50, 50] });
            }
        }

        function toggleMapLayer(key, val) {
            mapLayersVisible[key] = val;
            renderLeafletMapData();
        }
